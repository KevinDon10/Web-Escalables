<article class="user-card">
  <div class="card-header">
    <img class="avatar" [src]="user().image" [alt]="'Avatar de ' + user().name">
  </div>
 
  <div class="card-body">
    <span class="user-badge" [title]="'ID completo: ' + user().id">
      ID: …{{ user().id.slice(-4) }}
    </span>
    <h2 class="user-name">{{ user().name }}</h2>
    <p class="user-username">&#64;{{ user().username }}</p>
    <p class="user-email">{{ user().email }}</p>
    <button class="delete-button" type="button" (click)="delete()">
      Eliminar
    </button>
  </div>
</article>
