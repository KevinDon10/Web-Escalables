<main class="profile-page">
  <section class="profile-card">
    <a class="brand" routerLink="/">✂ <span>Barber Kev's</span></a>
    <header><span class="eyebrow">Tu cuenta</span><h1>Mi perfil.</h1><p>Actualiza tu información personal.</p></header>
    @if (notice()) { <p class="notice" role="status">{{ notice() }}</p> }
    @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
    <form (ngSubmit)="save()">
      <div class="form-grid">
        <label>Nombre<input name="nombre" [(ngModel)]="profile.nombre" required></label>
        <label>Apellidos<input name="apellidos" [(ngModel)]="profile.apellidos" required></label>
      </div>
      <label>Correo electrónico<input name="correo" type="email" [(ngModel)]="profile.correo" required></label>
      <label>Teléfono<input name="telefono" type="tel" [(ngModel)]="profile.telefono" placeholder="Tu teléfono"></label>
      <div class="password-heading"><span class="eyebrow">Seguridad</span><p>Cambiar contraseña <span>(opcional)</span></p></div>
      <div class="form-grid">
        <label>Contraseña actual<input name="currentPassword" type="password" [(ngModel)]="currentPassword" autocomplete="current-password" placeholder="Contraseña actual"></label>
        <label>Nueva contraseña<input name="newPassword" type="password" [(ngModel)]="newPassword" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8"></label>
      </div>
      <button class="button button-gold" type="submit" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar cambios' }} <span>→</span></button>
    </form>
  </section>
</main>
